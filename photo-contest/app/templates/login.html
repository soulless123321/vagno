<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Arctic Photo</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a; --surface-color: #1e293b; --text-main: #f8fafc;
            --text-muted: #94a3b8; --accent: #38bdf8; --accent-hover: #0ea5e9; --border-color: #334155;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        body {
            background: linear-gradient(rgba(15, 23, 42, 0.8), rgba(15, 23, 42, 0.9)), url('https://images.unsplash.com/photo-1483347756197-71ef80e95f73?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;
            color: var(--text-main); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
        }

        .login-box {
            background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color); border-radius: 20px; padding: 40px; width: 100%; max-width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .logo { font-size: 28px; font-weight: 900; color: var(--text-main); text-decoration: none; display: block; text-align: center; margin-bottom: 30px; }
        .logo span { color: var(--accent); }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: var(--text-muted); font-size: 14px; font-weight: 600; }
        .form-group input {
            width: 100%; padding: 14px; background: rgba(15, 23, 42, 0.5); border: 1px solid var(--border-color);
            border-radius: 10px; color: var(--text-main); font-size: 16px; transition: 0.3s;
        }
        .form-group input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2); }

        .btn {
            width: 100%; background: var(--accent); color: #000; padding: 14px; border-radius: 10px;
            font-weight: 800; font-size: 16px; cursor: pointer; border: none; transition: 0.3s; margin-top: 10px;
        }
        .btn:hover { background: var(--accent-hover); transform: translateY(-2px); }

        .error-msg { color: #ef4444; text-align: center; margin-top: 15px; font-size: 14px; display: none; }
        .link-text { text-align: center; margin-top: 20px; font-size: 14px; color: var(--text-muted); }
        .link-text a { color: var(--accent); text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="login-box">
        <a href="/" class="logo">❄️ Arctic <span>Photo</span></a>

        <form id="login-form">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required placeholder="your@email.com">
            </div>
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn" id="submit-btn">Войти</button>
            <div id="error-message" class="error-msg"></div>
        </form>

        <div class="link-text">
            Нет аккаунта? <a href="/register.html">Зарегистрироваться</a>
        </div>
    </div>

    <script src="/static/js/login.js"></script>
</body>
</html>
