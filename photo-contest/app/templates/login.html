{% extends 'base.html' %}
{% load static %}

{% block title %}Вход — Arctic Photo{% endblock %}

{% block body %}
<div class="container" style="max-width: 440px; padding: 60px 20px;">
    <div style="background: var(--bg-secondary); border-radius: var(--radius-lg); padding: 40px; border: 1px solid var(--border-color); box-shadow: var(--shadow-lg);">
        <div style="text-align: center; margin-bottom: 32px;">
            <h1 style="font-size: 2rem; margin-bottom: 8px;">📷 Arctic Photo</h1>
            <p class="text-muted" style="font-size: 0.95rem;">Войдите или создайте аккаунт</p>
        </div>

        <!-- Табы -->
        <div style="display: flex; gap: 8px; margin-bottom: 24px; background: var(--bg-tertiary); padding: 4px; border-radius: var(--radius-sm);">
            <button class="tab-btn active" data-tab="login" style="flex: 1; padding: 10px; background: var(--accent); color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; font-family: inherit; transition: var(--transition);">Вход</button>
            <button class="tab-btn" data-tab="register" style="flex: 1; padding: 10px; background: transparent; color: var(--text-muted); border: none; border-radius: 4px; cursor: pointer; font-weight: 600; font-family: inherit; transition: var(--transition);">Регистрация</button>
        </div>

        <!-- Форма входа -->
        <form id="login-form">
            <div style="margin-bottom: 16px;">
                <label style="display: block; margin-bottom: 6px; font-size: 0.88rem; color: var(--text-muted);">Email</label>
                <input type="email" name="email" class="input" required placeholder="your@email.com">
            </div>
            <div style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 6px; font-size: 0.88rem; color: var(--text-muted);">Пароль</label>
                <input type="password" name="password" class="input" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary btn-block">Войти</button>
            <div id="login-error" class="error-msg"></div>
        </form>

        <!-- Форма регистрации -->
        <form id="register-form" style="display: none;">
            <div style="margin-bottom: 16px;">
                <label style="display: block; margin-bottom: 6px; font-size: 0.88rem; color: var(--text-muted);">Имя (латиница)</label>
                <input type="text" name="name" class="input" required placeholder="JohnDoe" pattern="[A-Za-z]+">
            </div>
            <div style="margin-bottom: 16px;">
                <label style="display: block; margin-bottom: 6px; font-size: 0.88rem; color: var(--text-muted);">Email</label>
                <input type="email" name="email" class="input" required placeholder="your@email.com">
            </div>
            <div style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 6px; font-size: 0.88rem; color: var(--text-muted);">Пароль</label>
                <input type="password" name="password" class="input" required placeholder="Мин. 8 символов, цифра и спецсимвол">
                <small style="color: var(--text-muted); font-size: 0.78rem; margin-top: 4px; display: block;">
                    Мин. 8 символов, хотя бы одна цифра и спецсимвол (!@#$%^&*)
                </small>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Зарегистрироваться</button>
            <div id="register-error" class="error-msg"></div>
        </form>
    </div>
</div>

<script>
    // Переключение табов
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.classList.remove('active');
                b.style.background = 'transparent';
                b.style.color = 'var(--text-muted)';
            });
            btn.classList.add('active');
            btn.style.background = 'var(--accent)';
            btn.style.color = 'white';

            const tab = btn.dataset.tab;
            document.getElementById('login-form').style.display = tab === 'login' ? 'block' : 'none';
            document.getElementById('register-form').style.display = tab === 'register' ? 'block' : 'none';
        });
    });

    // Вход
    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errBox = document.getElementById('login-error');
        errBox.classList.remove('visible');
        const btn = e.target.querySelector('button');
        btn.disabled = true;
        btn.textContent = 'Вход...';

        const formData = new URLSearchParams();
        formData.append('email', e.target.email.value);
        formData.append('password', e.target.password.value);

        try {
            const res = await fetch('/api/auth/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData.toString()
            });
            const data = await res.json();

            if (res.ok && data.code === 200) {
                localStorage.setItem('auth_token', data.data.token);
                localStorage.setItem('auth_user', JSON.stringify(data.data.user));
                toast('Добро пожаловать!', 'success');
                setTimeout(() => window.location.href = '/', 800);
            } else {
                errBox.textContent = data.message || 'Ошибка входа';
                errBox.classList.add('visible');
            }
        } catch (err) {
            errBox.textContent = 'Ошибка сети';
            errBox.classList.add('visible');
        } finally {
            btn.disabled = false;
            btn.textContent = 'Войти';
        }
    });

    // Регистрация
    document.getElementById('register-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errBox = document.getElementById('register-error');
        errBox.classList.remove('visible');
        const btn = e.target.querySelector('button');
        btn.disabled = true;
        btn.textContent = 'Регистрация...';

        const formData = new URLSearchParams();
        formData.append('name', e.target.name.value);
        formData.append('email', e.target.email.value);
        formData.append('password', e.target.password.value);

        try {
            const res = await fetch('/api/users/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData.toString()
            });
            const data = await res.json();

            if (res.ok && data.code === 201) {
                toast('Аккаунт создан! Проверьте почту для активации.', 'success');
                setTimeout(() => {
                    document.querySelector('[data-tab="login"]').click();
                }, 2000);
            } else {
                if (data.errors) {
                    const msgs = Object.values(data.errors).flat().join('; ');
                    errBox.textContent = msgs;
                } else {
                    errBox.textContent = data.message || 'Ошибка регистрации';
                }
                errBox.classList.add('visible');
            }
        } catch (err) {
            errBox.textContent = 'Ошибка сети';
            errBox.classList.add('visible');
        } finally {
            btn.disabled = false;
            btn.textContent = 'Зарегистрироваться';
        }
    });
</script>
{% endblock %}
